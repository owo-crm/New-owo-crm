# Сайт OWO Ads (папка landing/) → GitHub Pages. Решение 041.
# Запускается при изменении landing/ в main или вручную (Actions → Landing → Run workflow).
# Один раз включить: Settings → Pages → Source: «GitHub Actions».
# Свой домен позже: Settings → Pages → Custom domain (и файл landing/CNAME с доменом).
name: Landing

on:
  push:
    branches: [main]
    paths: ["landing/**", ".github/workflows/landing-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
