name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/owo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint + typecheck + unit/DB tests
        run: npm run check
      - name: Migrations apply on real Postgres (twice = idempotent)
        run: npm run db:migrate && npm run db:migrate
      - name: Build
        run: npm run build
      - name: E2E (real Postgres, desktop + mobile)
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "create database owo_e2e"
          npx playwright install --with-deps chromium
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/owo_e2e npm run test:e2e
        env:
          CI: "1"
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
